name: CI Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ScreenBrightnessTool-Windows
            artifact_path: dist/ScreenBrightnessTool-Windows.exe
            build_cmd: pyinstaller --clean --noconsole --onefile --icon=icon.ico --name=ScreenBrightnessTool-Windows --add-data "icon.png;." main.py
          - os: macos-latest
            artifact_name: ScreenBrightnessTool-macOS
            artifact_path: dist/ScreenBrightnessTool-macOS
            build_cmd: pyinstaller --clean --noconsole --onefile --name=ScreenBrightnessTool-macOS --add-data "icon.png:." main.py
          - os: ubuntu-latest
            artifact_name: ScreenBrightnessTool-Linux
            artifact_path: dist/ScreenBrightnessTool-Linux
            build_cmd: pyinstaller --clean --noconsole --onefile --name=ScreenBrightnessTool-Linux --add-data "icon.png:." main.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build with PyInstaller
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenBrightnessTool-Windows/ScreenBrightnessTool-Windows.exe
            ScreenBrightnessTool-macOS/ScreenBrightnessTool-macOS
            ScreenBrightnessTool-Linux/ScreenBrightnessTool-Linux
          draft: false
          prerelease: false
          generate_release_notes: true
